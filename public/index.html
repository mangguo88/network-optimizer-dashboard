<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Optimizer Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen p-6">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-8">网络优选与测速面板</h1>
        
        <!-- 本地 IP 状态卡片 -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">📍 本地网络状态</h2>
            <div id="my-network-info" class="text-gray-600">正在自动获取您的网络信息...</div>
        </div>

        <!-- 优选 IP 测速卡片 -->
        <div class="bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-xl font-semibold">⚡ 智能节点测速优选</h2>
                <button id="start-test-btn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded transition">
                    开始自动优选
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full text-left">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600">
                            <th class="py-2 px-4">节点名称</th>
                            <th class="py-2 px-4">IP 地址</th>
                            <th class="py-2 px-4">延迟 (ms)</th>
                            <th class="py-2 px-4">状态</th>
                        </tr>
                    </thead>
                    <tbody id="ip-table-body">
                        <tr><td colspan="4" class="text-center py-4 text-gray-500">点击右上角按钮开始获取节点并测速</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
